[package]
name = "tilegrabber"
version = "0.4.8"
edition = "2021"

[lib]
name = "tilegrabber_lib"
crate-type = ["lib", "cdylib", "staticlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon"] }
tauri-plugin-dialog = "2"
tauri-plugin-fs = "2"
tauri-plugin-notification = "2"
tauri-plugin-shell = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

# XML 解析 (lrc 文件)
quick-xml = { version = "0.37", features = ["serialize"] }
encoding_rs = "0.8"

# Gzip 解压 (lra 文件)
flate2 = "1"

# Zip 打包 (任务导入/导出)
zip = "2"

tauri-plugin-single-instance = "2"

# HTTP 客户端 (WMTS/TMS 探测 + 更新包下载)
reqwest = { version = "0.12", features = ["rustls-tls", "gzip", "brotli", "deflate", "stream", "http2"], default-features = false }
url = "2"
tokio = { version = "1", features = ["full"] }
futures-util = "0.3"

# 错误处理
anyhow = "1"
thiserror = "2"

# 日志/追踪
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
tracing-appender = "0.2"

# UUID
uuid = { version = "1", features = ["v4"] }

# 时间
chrono = { version = "0.4", features = ["serde"] }

# 数据库
rusqlite = { version = "0.31", features = ["bundled"] }

# 随机数 (反封禁延迟 + UA 轮换)
rand = "0.8"

# 磁盘空间查询（下载前预检）
fs2 = "0.4"

# 图像处理 (GeoTIFF 导出：瓦片解码 + 拼接)
image = { version = "0.25", default-features = false, features = ["png", "jpeg", "webp"] }
tiff = "0.9"

# 并行迭代器（导出多线程加速）
rayon = "1"

# 瓦片发布服务
axum = { version = "0.7", features = [] }
tower-http = { version = "0.5", features = ["cors"] }
tower = { version = "0.4" }
roxmltree = "0.21.1"
tauri-plugin-updater = "2"
tauri-plugin-process = "2"
pmtiles = { version = "0.23", default-features = false, features = ["write", "tilejson"] }

[profile.release]
panic = "unwind"
codegen-units = 1
lto = true
opt-level = "s"
strip = true

[dev-dependencies]
tempfile = "3"

[patch.crates-io]
tiff = { path = "vendor/tiff" }
